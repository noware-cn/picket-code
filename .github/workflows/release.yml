name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      vscode_version:
        description: "Upstream VS Code tag (e.g. 1.142.0). Defaults to latest stable."
        required: false
        type: string
      pre_release:
        description: "Mark the release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# WSL server component (docs/superpowers/plans/2026-11-04-picket-wsl.md Task 12).
# Public builds ship the ondemand flavor: the app carries only the component
# catalog and downloads the payload on first use. Embedded builds (payload
# inside the app, zero first-use download) are cut by the internal
# distribution from a checkout that overrides PICKET_WSL_PAYLOAD=embedded.
# The server is versioned separately from the client, so a build states a floor
# and a version rather than an exact tag: PICKET_SERVER_MIN_VERSION is the oldest
# picket-code-server this client accepts, PICKET_SERVER_VERSION is the payload it
# ships and defaults to the floor, exactly as build.sh does. Only the floor is
# required: a repository that never set the optional version must not fail — the
# empty value would otherwise reach fetch-payload.sh and the offline bundle.
# That repository is public, so the payload is fetched over plain HTTPS and
# no token is involved. (Setting PICKET_SERVER_TOKEN still switches
# fetch-payload.sh to `gh`, for a private mirror via PICKET_SERVER_REPO.)
env:
  PICKET_WSL_PAYLOAD: ondemand
  PICKET_SERVER_MIN_VERSION: ${{ vars.PICKET_SERVER_MIN_VERSION }}
  PICKET_SERVER_VERSION: ${{ vars.PICKET_SERVER_VERSION || vars.PICKET_SERVER_MIN_VERSION }}

# Gate order (docs/testing.md §3.1): the automated test layers run before anything is
# compiled, packaged or published, so a red layer means no artifacts and no release.
#   tests     → L1 (iCode + agentHostChangeset) and L2 (fake ACP CLI) + contract checks
#   tests-ui  → L4 (Electron/Agents Window smoke) + the WSL acceptance matrix
#               (build/wsl/acceptance.sh --all), tag pushes only: ~40 and ~15 minutes
# `tests-ui` reports one result for both of its jobs, so a red WSL job blocks the release
# through the existing `needs.tests-ui.result == 'success'` guards below — no extra
# condition, and no way for the WSL layer to be skipped into a green state.
# A reusable-workflow job cannot carry `timeout-minutes`; every job inside tests.yml and
# tests-ui.yml sets its own, which bounds those jobs.
jobs:
  # Version resolution first: vscode tag, upstream node version, picket-code version.
  versions:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      vscode: ${{ steps.versions.outputs.vscode }}
      node: ${{ steps.versions.outputs.node }}
      picket-code: ${{ steps.versions.outputs.picket-code }}
    steps:
      - name: Resolve versions (vscode tag, node from upstream .nvmrc)
        id: versions
        shell: bash
        env:
          # The anonymous api.github.com limit (60 req/h, shared runner IPs) made this
          # step fail with 403 on tag pushes. Tag pushes no longer touch the API at all;
          # the token only covers the "latest stable" lookup for manual runs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.vscode_version }}" ]; then
            VSCODE_TAG="${{ github.event.inputs.vscode_version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Release tags are named after the upstream VS Code version (v1.143.1, or
            # v1.143.1-p5 for the retired pre-releases): strip "v" and any "-pN" suffix.
            VSCODE_TAG="${GITHUB_REF_NAME#v}"
            VSCODE_TAG="${VSCODE_TAG%%-p*}"
          else
            VSCODE_TAG="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/microsoft/vscode/releases/latest | python3 -c 'import sys,json;print(json.load(sys.stdin)["tag_name"])')"
          fi
          VSCODE_TAG="$(printf '%s' "$VSCODE_TAG" | tr -d '[:space:]')"
          echo "vscode=$VSCODE_TAG" >> "$GITHUB_OUTPUT"
          NODE_VERSION="$(curl -fsSL "https://raw.githubusercontent.com/microsoft/vscode/$VSCODE_TAG/.nvmrc" | tr -d '[:space:]')"
          echo "node=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "picket-code=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "picket-code=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

  # ---- release gate ---------------------------------------------------------------------
  # Both jobs reuse the standalone workflows, so a release runs exactly what a PR runs.
  tests:
    name: "Tests (contract + L1 + L2 + L3)"
    needs: versions
    uses: ./.github/workflows/tests.yml
    with:
      # Test the tree this release is built from, not "whatever is newest upstream".
      vscode_version: ${{ needs.versions.outputs.vscode }}

  # 35–45 minutes for the UI job plus ~15 for the WSL matrix: only worth it when
  # something is about to be published.
  tests-ui:
    name: "Tests (L4 UI smoke + WSL acceptance)"
    needs: versions
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/tests-ui.yml
    with:
      vscode_version: ${{ needs.versions.outputs.vscode }}
    secrets:
      # The WSL job installs the noware-cn/picket-code-server payload, which is
      # public and needs no credential. A reusable workflow still only sees the
      # secrets the caller names, so the optional token is forwarded for the
      # private-mirror case; the version travels through the repository variables.
      PICKET_SERVER_TOKEN: ${{ secrets.PICKET_SERVER_TOKEN }}

  # Compile stage: clone + patch + npm ci + upstream min build, then ship the
  # vscode/ tree + built VSCode-<plat>-<arch> as vscode.tar.gz. Mirrors
  # VSCodium's compile job; no packaging happens here.
  compile:
    name: "Compile ${{ matrix.platform }}-${{ matrix.arch }}"
    needs: [versions, tests, tests-ui]
    # The gate: nothing is built unless the test layers passed. `tests-ui` only runs on
    # tag pushes, so a manual (non-tag) dispatch is gated by `tests` alone.
    if: ${{ !cancelled() && needs.tests.result == 'success' && (needs.tests-ui.result == 'success' || needs.tests-ui.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: win32
            arch: x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.versions.outputs.node }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbfile-dev libsecret-1-dev libkrb5-dev \
            libnss3 libxss1 libatk-bridge2.0-0 libgtk-3-0

      - name: Compile
        shell: bash
        env:
          # Built-in extensions (ms-vscode.js-debug*) are fetched from their GitHub releases;
          # the token lifts the 60 req/h anonymous API limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash build/build.sh "${{ needs.versions.outputs.vscode }}" \
            "${{ needs.versions.outputs.picket-code }}" \
            "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Upload vscode artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-${{ matrix.platform }}
          path: vscode.tar.gz
          retention-days: 30

  # Package stage: per-platform, consumes the compile artifact, renames to
  # picket-code-*, archives, checksums. Mirrors VSCodium's package jobs.
  package:
    name: "Package ${{ matrix.platform }}-${{ matrix.arch }}"
    needs: [versions, compile, tests, tests-ui]
    # Same gate as compile; listed here too so the dependency is explicit in the graph
    # instead of only transitive.
    if: ${{ !cancelled() && needs.tests.result == 'success' && (needs.tests-ui.result == 'success' || needs.tests-ui.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: win32
            arch: x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Download vscode artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode-${{ matrix.platform }}
          path: artifact

      - name: Move artifact to workspace root
        shell: bash
        run: |
          mv artifact/vscode.tar.gz ./vscode.tar.gz

      - name: Package
        shell: bash
        run: |
          bash build/${{ matrix.platform }}/package.sh "${{ matrix.platform }}" "${{ matrix.arch }}"

      # The offline component bundle is platform-independent (a Linux server
      # payload plus metadata), so it is built once, in the win32 job only —
      # WSL is a Windows-host scenario and duplicate artifact names collide.
      # The payload's commit is read from the packaged app: that is the value the
      # client stamps, so the bundle's catalog must carry the same one.
      - name: Offline WSL component bundle
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          APP="picket-code-win32-${{ matrix.arch }}/resources/app"
          export PICKET_SERVER_COMMIT="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).commit ?? "")' "$APP/product.json")"
          if [ -z "$PICKET_SERVER_COMMIT" ]; then
            echo "the packaged product.json carries no commit" >&2
            exit 1
          fi
          bash build/wsl/fetch-payload.sh "$PICKET_SERVER_VERSION"
          node build/wsl/offline-bundle.mjs \
            --dir build/wsl/download --version "$PICKET_SERVER_VERSION" \
            --min-version "$PICKET_SERVER_MIN_VERSION" \
            --out "picket-code-${{ github.ref_name }}-offline-wsl.zip"

      # The archives leave package.sh under a version-less name so the checks below
      # can address one stable directory. Published files, however, carry the tag:
      # mirror URLs stay immutable, so they can be cached forever and three versions
      # can coexist without sharing names.
      - name: Version the artifacts
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          for f in picket-code-${{ matrix.platform }}-${{ matrix.arch }}.*; do
            mv "$f" "${f/picket-code-/picket-code-${GITHUB_REF_NAME}-}"
          done
          ls -l picket-code-*

      # Guard for the asar writer race (build/patches/56): a mis-assigned offset
      # makes one file read back as another, which is how `tar/package.json`
      # ended up containing a LICENSE text and the agent host stopped starting.
      - name: Verify asar layout
        shell: bash
        run: |
          node build/check-asar.mjs \
            picket-code-${{ matrix.platform }}-${{ matrix.arch }}/resources/app/node_modules.asar

      # The Copilot removal (patches 52/53) must not leave dangling product.json
      # keys that point at extensions we do not ship: defaultChatAgent would make
      # the account/chat UI offer a sign-in for a missing extension.
      # builtInExtensionsEnabledWithAutoUpdates stays, but empty: upstream iterates
      # it without a guard (extensionsScannerService), so removing the key shipped
      # a build whose extension scanner threw and loaded zero extensions.
      - name: Verify no Copilot residues
        shell: bash
        run: |
          app=picket-code-${{ matrix.platform }}-${{ matrix.arch }}/resources/app
          fail=0
          for key in defaultChatAgent trustedExtensionAuthAccess updateUrl; do
            if grep -q "\"$key\"" "$app/product.json"; then
              echo "RESIDUE: product.json still defines $key"
              fail=1
            fi
          done
          if ! node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const v = p.builtInExtensionsEnabledWithAutoUpdates;
            process.exit(Array.isArray(v) && v.length === 0 ? 0 : 1);
          ' "$app/product.json"; then
            echo "RESIDUE: builtInExtensionsEnabledWithAutoUpdates must ship as an empty array"
            fail=1
          fi
          if grep -qiE 'github\.copilot|github-authentication|microsoft-authentication' "$app/product.json"; then
            echo "RESIDUE: product.json still references a removed Copilot/auth extension"
            fail=1
          fi
          for ext in github github-base github-authentication microsoft-authentication; do
            if [ -d "$app/extensions/$ext" ]; then
              echo "RESIDUE: extensions/$ext shipped"
              fail=1
            fi
          done
          # no Copilot CLI shim: the terminal would offer a command that cannot run
          shim=$(find "$app" -maxdepth 3 -iname 'copilot*' -not -path '*node_modules*' 2>/dev/null)
          if [ -n "$shim" ]; then
            echo "RESIDUE: Copilot CLI shim shipped: $shim"
            fail=1
          fi
          # We have no update server: the stock Windows updater would ask GitHub's
          # releases page for update metadata and log "Server returned 404" on every
          # start. Without updateUrl it disables itself (abstractUpdateService.ts).
          if grep -q '"updateUrl"' "$app/product.json"; then
            echo "RESIDUE: product.json still defines updateUrl"
            fail=1
          fi
          # Reporting only: the chat UI keeps upstream strings, so this number is a
          # baseline to watch, not a gate.
          bundle="$app/out/vs/workbench/workbench.desktop.main.js"
          if [ -f "$bundle" ]; then
            echo "info: 'Copilot' appears $(grep -o 'Copilot' "$bundle" | wc -l) times in the workbench bundle"
          fi
          if [ "$fail" -eq 0 ]; then echo "no Copilot residues in the packaged app"; fi
          exit $fail

      - name: Smoke test packaged app
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "picket-code-win32-x64"
          $exe = (Get-ChildItem "$root\*.exe" | Where-Object {
            $_.Name -notmatch 'ffmpeg|elevate|crashpad' } | Select-Object -First 1).FullName
          $logs = "$env:APPDATA\Picket Code\logs"
          Remove-Item $logs -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList '--verbose' -PassThru
          Start-Sleep -Seconds 55
          $hits = @()
          if (Test-Path $logs) {
            $hits = Get-ChildItem $logs -Recurse -Filter *.log -ErrorAction SilentlyContinue |
              Select-String -Pattern 'ERR_INVALID_PACKAGE_CONFIG|Invalid package config|Uncaught Exception|Could not locate the bindings file|Cannot find module|is not iterable|Error scanning installed extensions|reading .extensionId'
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($hits) {
            $hits | ForEach-Object { "HIT: " + $_.Line.Trim() }
            exit 1
          }
          "no packaging errors in app logs"

      - name: Checksums
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          # One file per matrix job: a plain checksum file would be overwritten by the
          # other job when the artifacts are merged with `merge-multiple`.
          # Normalize to "<hash>  <name>": the Windows runner's sha256sum writes
          # "<hash> *<name>" (binary marker), so the merged file stays uniform.
          sha256sum picket-code-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.* \
            | sed 's/ \*/  /' \
            > SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Upload picket-code artifacts
        uses: actions/upload-artifact@v7
        with:
          name: picket-code-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            picket-code-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.*
            picket-code-${{ github.ref_name }}-offline-wsl.zip
            SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [package, tests, tests-ui]
    # Publishing is impossible unless every layer passed: the tag-only L4 job must be
    # green here, not merely skipped, because a tag build is what users download.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.package.result == 'success' && needs.tests.result == 'success' && needs.tests-ui.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # `gh release view/edit` shell out to git when they cannot resolve the repo
      # from flags, so give the job a real checkout instead of relying on that.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Only the final deliverables: the vscode-* compile intermediates are not published
      # and pulling them here just cost disk and time.
      - uses: actions/download-artifact@v8
        with:
          pattern: picket-code-*
          path: artifacts
          merge-multiple: true

      - name: Merge per-arch checksums
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/SHA256SUMS-* > "artifacts/picket-code-${{ github.ref_name }}-SHA256SUMS"
          cat "artifacts/picket-code-${{ github.ref_name }}-SHA256SUMS"

      # The JUnit XML from the gate jobs, merged into one directory: L1/L2/L3 from
      # tests.yml (test-results-unit, test-results-acp-process, test-results-host-e2e),
      # L4 from tests-ui.yml (test-results-ui) and the WSL smoke area from the same
      # workflow (test-results-wsl).
      - name: Download the test reports (L1–L4)
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-report
          merge-multiple: true

      # Zero-dependency script, so the runner's own node is enough here.
      - name: Summarize the test reports (JUnit → Markdown)
        shell: bash
        run: |
          echo "==> node build/test/summarize.mjs --dir test-report"
          node build/test/summarize.mjs --dir test-report

      - name: Package the test report
        shell: bash
        run: |
          set -euo pipefail
          echo "==> tar -czf test-report-${{ github.ref_name }}.tar.gz test-report"
          tar -czf "test-report-${{ github.ref_name }}.tar.gz" test-report
          ls -l "test-report-${{ github.ref_name }}.tar.gz"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # Publish only final deliverables; drop build intermediates (vscode.tar.gz).
          # The versioned names (archives + checksums) all start with `picket-code-`.
          files: |
            artifacts/picket-code-*
            test-report-*.tar.gz
          # A tag push carries no inputs, so the manual `pre_release` switch alone made
          # every `-rc.N` tag publish as a full release competing for the Latest badge.
          # The tag name decides; the switch only adds to it.
          prerelease: ${{ github.event.inputs.pre_release == 'true' || contains(github.ref_name, '-rc.') }}
          generate_release_notes: true

      # Put the mirror links on top of the generated notes; the script is shared with
      # the asset migration workflow so a renamed mirror never leaves stale links.
      - name: Add mirror links to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: bash .github/scripts/prefix-mirror-links.sh

  # Mirror the published artifacts to Cloudflare R2. Files keep their versioned
  # names, so a URL never changes meaning; the prune step keeps the newest three
  # versions and drops older ones. Secrets: R2_ACCESS_KEY_ID /
  # R2_SECRET_ACCESS_KEY / R2_ENDPOINT.
  r2-sync:
    name: Sync to Cloudflare R2 (keep 3 versions)
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      # Take the assets from the published release rather than from the run artifacts:
      # the merged checksum file only exists there, and the pattern picks up whatever
      # platforms the matrix produced.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern 'picket-code-*'
          ls -l release

      - name: Install rclone
        run: |
          curl -fsSL -o rclone.deb https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone.deb
          rclone version

      # `copy`, never `sync`: the bucket now holds several versions, and older ones
      # are removed only by the explicit prune below. The checksum file goes up
      # separately: rclone falls back to application/octet-stream for names
      # without an extension, which makes browsers download it instead of showing
      # it. Every object is version-named, so the cache headers can be immutable.
      - name: Upload release artifacts to R2
        run: |
          set -euo pipefail
          rclone copy --s3-no-check-bucket --exclude '*-SHA256SUMS' \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            release/ r2:picket-releases/ --progress
          sums="$(ls release/*-SHA256SUMS)"
          rclone copyto --s3-no-check-bucket --ignore-times \
            --header-upload "Content-Type: text/plain; charset=utf-8" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            "$sums" "r2:picket-releases/$(basename "$sums")"

      - name: Prune R2 (keep 3 versions)
        run: bash .github/scripts/prune-r2.sh

      - name: Verify R2 objects
        run: rclone lsl r2:picket-releases/
